<!doctype html>
<!-- Sanitized snippet of https://www.deathwishcoffee.com/cart, saved 2026-10-05.
     Only the buy-intent controls are kept; scripts, tokens and store identifiers are removed. -->
<html><head><meta charset="utf-8"></head><body>
<!-- #cart-icon-bubble -->
<a href="/cart" class="header__icon header__icon--cart link focus-inset" id="cart-icon-bubble">
<span class="visually-hidden">Cart</span><div class="cart-count-bubble"><span aria-hidden="true">1</span><span class="visually-hidden">1 item</span>
          </div></a>
<!-- .cart__ctas -->
<div class="cart__ctas">
                <button type="submit" id="checkout" class="cart__checkout-button button" name="checkout" form="cart">
                  Check out
                </button>
              </div>
<!-- .cart__dynamic-checkout-buttons -->
<div class="cart__dynamic-checkout-buttons additional-checkout-buttons">
                  <div class="dynamic-checkout__content" id="dynamic-checkout-cart" data-shopify="dynamic-checkout-cart"> <shopify-accelerated-checkout-cart requires-shipping=""> <div class="wallet-button-wrapper"> <ul class="wallet-cart-grid wallet-cart-grid--skeleton" role="list" data-shopify-buttoncontainer="true"> <li class="wallet-cart-button-container"><div class="wallet-cart-button wallet-cart-button__skeleton" role="button" disabled="" aria-hidden="true">&nbsp;</div></li><li class="wallet-cart-button-container"><div class="wallet-cart-button wallet-cart-button__skeleton" role="button" disabled="" aria-hidden="true">&nbsp;</div></li><li class="wallet-cart-button-container"><div class="wallet-cart-button wallet-cart-button__skeleton" role="button" disabled="" aria-hidden="true">&nbsp;</div></li><li class="wallet-cart-button-container"><div class="wallet-cart-button wallet-cart-button__skeleton" role="button" disabled="" aria-hidden="true">&nbsp;</div></li> </ul> </div> </shopify-accelerated-checkout-cart> </div>
                </div>
<!-- #CartItem-1 .cart-item__quantity -->
<td class="cart-item__quantity">
                    <div class="cart-item__quantity-wrapper">
                      <label class="visually-hidden" for="Quantity-1">
                        Quantity
                      </label>
                      <quantity-input class="quantity cart-quantity">
                        <button class="quantity__button no-js-hidden" name="minus" type="button">
                          <span class="visually-hidden">Decrease quantity for Crossbones Klean Kanteen Mug</span>
                        </button>
                        <input class="quantity__input" data-quantity-variant-id="1" type="number" name="updates[]" value="1" data-cart-quantity="1" min="1" step="1" aria-label="Quantity for Crossbones Klean Kanteen Mug" id="Quantity-1" data-index="1">
                        <button class="quantity__button no-js-hidden" name="plus" type="button">
                          <span class="visually-hidden">Increase quantity for Crossbones Klean Kanteen Mug</span>
                        </button>
                      </quantity-input>
                      <cart-remove-button id="Remove-1" data-index="1">
                        <a href="/cart/change?id=1:0&amp;quantity=0" class="quantity__remove button--tertiary" aria-label="Remove Crossbones Klean Kanteen Mug">
                        </a>
                      </cart-remove-button>
                    </div>
                    <div class="cart-item__error" id="Line-item-error-1" role="alert">
                      <small class="cart-item__error-text"></small>
                    </div>
                  </td>
</body></html>
