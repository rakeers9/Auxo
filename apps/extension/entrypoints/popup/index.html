<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- WXT uses the title as the toolbar button's tooltip (action.default_title). -->
    <title>Auxo</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #ffffff;
        --fg: #1a1a1a;
        --muted: #5f6368;
        --line: #e3e3e3;
        --accent: #1d4ed8;
        --focus: #2563eb;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #1c1c1e;
          --fg: #f2f2f2;
          --muted: #a8a8ad;
          --line: #3a3a3c;
          --accent: #93b4ff;
          --focus: #93b4ff;
        }
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        width: 340px;
        max-height: 560px;
        background: var(--bg);
        color: var(--fg);
        font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      .auxo-header { padding: 12px 16px; border-bottom: 1px solid var(--line); }
      .auxo-brand { margin: 0; font-size: 16px; font-weight: 700; letter-spacing: 0.02em; }
      .auxo-main { padding: 12px 16px 16px; }
      .auxo-title { margin: 0 0 8px; font-size: 14px; font-weight: 600; }
      .auxo-status:empty { display: none; }
      .auxo-status { margin: 0 0 8px; color: var(--muted); font-size: 12px; }
      .auxo-empty, .auxo-loading { margin: 0; color: var(--muted); }
      .auxo-list { list-style: none; margin: 0; padding: 0; }
      .auxo-item {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 2px 12px;
        padding: 10px 0;
        border-top: 1px solid var(--line);
      }
      .auxo-item:first-child { border-top: 0; }
      .auxo-name {
        grid-column: 1;
        color: var(--fg);
        overflow-wrap: anywhere;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }
      a.auxo-name { color: var(--accent); text-decoration: none; }
      a.auxo-name:hover { text-decoration: underline; }
      .auxo-meta { grid-column: 1; margin: 0; color: var(--muted); font-size: 12px; }
      .auxo-remove {
        grid-column: 2;
        grid-row: 1 / span 2;
        align-self: center;
        padding: 4px 10px;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: transparent;
        color: var(--fg);
        font: inherit;
        font-size: 12px;
        cursor: pointer;
      }
      .auxo-remove:hover { border-color: var(--muted); }
      .auxo-remove:disabled { opacity: 0.5; cursor: default; }
      :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
